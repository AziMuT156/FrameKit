name: FrameKit
options:
  bundleIdPrefix: com.framekit
  deploymentTarget:
    iOS: "15.0"
targets:
  FrameKit:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: www
        type: folder
        buildPhase: resources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framekit.app
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
